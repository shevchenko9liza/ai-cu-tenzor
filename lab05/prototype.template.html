function nav(){document.getElementById('navigation').innerHTML=[['overview','grid','Оборудование'],['tasks','task','Задания',S.tasks.length],['journal','clock','Журнал'],['scheme','data','Схема'],['about','info','О прототипе']].map(([id,i,t,n])=>`<button class="nav-item ${S.screen===id||id==='overview'&&['asset','decision','data'].includes(S.screen)?'active':''}" data-action="nav" data-to="${id}">${icon(i)}${t}${n?`<span class="count">${n}</span>`:''}</button>`).join('');}

function selectAsset(id){S.asset=id;S.tab='readings';S.metric='vibration';S.period='7d';go('asset');}
function chart(a=asset(),compact=false){const isTemp=S.metric==='temperature'&&!compact;const warning=a.id==='ПН-01';const min=isTemp?58:1.5,max=isTemp?78:5;const full=Array.from({length:25},(_,i)=>{let v=warning?(isTemp?62+(i/24)*12:2.2+(i/24)**1.8*2.2):(isTemp?62+Math.sin(i)*.8:(a.id==='ПН-03'?2.3:2.2)+Math.sin(i)*.12);if(i>0&&i<24)v+=Math.sin(i*2)*(isTemp?.6:.09);if(i===24&&!warning)v=isTemp?62:(a.id==='ПН-03'?2.3:2.2);return warning&&!isTemp?Support.vibration[i]:v;});const points=S.period==='24h'&&!compact?full.slice(-5):full;const n=points.length;const x=i=>44+i/(n-1)*600,y=v=>190-(v-min)/(max-min)*148;const path=points.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');const baseLo=isTemp?60:2,baseHi=isTemp?65:2.8;const ticks=isTemp?[60,65,70,75]:[2,3,4,5];return `<svg class="chart" viewBox="0 0 680 226" role="img" aria-label="Учебный тренд ${isTemp?'температуры':'виброскорости'} ${a.id}. ${warning?'Изменение с '+points[0].toFixed(1).replace('.',',')+' до '+points[n-1].toFixed(1).replace('.',',')+(isTemp?' градусов':' миллиметра в секунду'):'Показания около базового диапазона'}"><rect x="44" y="${y(baseHi)}" width="600" height="${y(baseLo)-y(baseHi)}" fill="#e9f2ef"/>${ticks.map(v=>`<line x1="44" x2="644" y1="${y(v)}" y2="${y(v)}" stroke="#e9edf2"/><text x="34" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}<text x="44" y="20">${isTemp?'°C':'мм/с, RMS'}</text><path d="${path} L644 190 L44 190 Z" fill="#12877e" opacity=".045"/><path d="${path}" fill="none" stroke="#12877e" stroke-width="2.7"/><circle cx="644" cy="${y(points[n-1])}" r="4" fill="${warning?'#c27b28':'#12877e'}" stroke="white" stroke-width="2"/>${(S.period==='24h'&&!compact?['24.10 10:00','24.10 18:00','25.10 02:00','25.10 10:00']:['19.10','21.10','23.10','25.10']).map((v,i)=>`<text x="${44+i*200}" y="215" text-anchor="${i===0?'start':i===3?'end':'middle'}">${v}</text>`).join('')}</svg>`;}
function timeline(){return `<ul class="timeline"><li><time>25 октября · 09:40</time><strong>ПН-01: новое предупреждение</strong><p>Вибрация и температура растут при сопоставимой подаче и частоте вращения.</p></li><li><time>25 октября · 03:00</time><strong>ПН-03: прервалась передача</strong><p>Оценка состояния приостановлена до проверки данных.</p></li><li><time>18 сентября</time><strong>ПН-01: плановый осмотр</strong><p>В учебном журнале нет подтверждённого дефекта.</p></li></ul>`;}
const metrics={

 temperature:{label:'Температура корпуса опоры',value:'74',unit:'°C',change:'+12 °C за 7 дней',color:'warm',tag:'ПН-01 · TEMP-DE',meaning:'Температура корпуса подшипниковой опоры со стороны привода. Это не температура питательной воды.',context:'В учебном ряду рост с 62 до 74 °C. Вместе с вибрацией даёт основание разбирать изменение, но не подтверждает его причину.',next:'Сопоставить с режимом, достоверностью измерения и условиями охлаждения. Передать наблюдение диагносту для проверки по документации агрегата.',limit:'Допустимую температуру задают для конкретной опоры и датчика. Значение в макете не является универсальным пределом.'},
 flow:{label:'Подача насоса',value:'780',unit:'м³/ч',change:'Сопоставимый режим',color:'cool',tag:'ПН-01 · FLOW-OUT',meaning:'Объёмный расход через насос в указанной точке измерения. Нужен для сравнения показаний в близких режимах.',context:'Учебное окно: 770–790 м³/ч. Устойчивый расход помогает не смешивать рост вибрации с очевидным изменением подачи.',next:'Сверить положение рабочей точки с характеристикой конкретного насоса и схемой рециркуляции. Если режим изменился, сравнивать с другим базовым периодом.',limit:'В макете нет заводской характеристики и минимально допустимой подачи. Делать вывод об эффективности или разрешать режим по этому числу нельзя.'},

 outlet:{label:'Давление на выходе',value:'18,0',unit:'МПа',change:'В учебном диапазоне',color:'lilac',tag:'ПН-01 · P-OUT',meaning:'Избыточное давление на нагнетании. Вместе с давлением на входе и подачей описывает рабочий режим.',context:'Учебное окно 17,9–18,1 МПа. Значения не привязаны к модели насоса заказчика.',next:'Сопоставить изменения с расходом, входным давлением и режимом системы. При расхождении запросить проверку приборов и технологического контекста.',limit:'Перепад давлений без плотности, скоростей и отметок не выдаётся за точный напор. Защитные уставки не заданы.'}
};

function operatingSummary(){const h=workingHypothesis();return `<section class="assessment" aria-label="Итог оценки ПН-01"><div><div class="eyebrow">ПН-01 · итог оценки</div><h2>${supportBlocked()?'Основание сигнала требует уточнения.':'Рост вибрации и нагрев опоры.'}</h2><p>Вибрация 4,4 мм/с и температура опоры 74 °C выше базового уровня при сопоставимых показаниях режима.</p></div><div class="conclusion"><strong>${h.title}</strong><p>${supportBlocked()?'Сначала проверить канал или смену режима.':'Первый шаг: обход и повторные измерения в текущую смену, затем проверка смазки и охлаждения.'}</p><span class="small muted">Неисправность подтверждена? Пока нет.</span></div>${btn('Разобрать предупреждение','overviewAnalysis',true)}</section>${supportSummary()}`;}

function schemePage(){const location=S.scheme==='location';return `<button class="back" data-action="nav" data-to="overview">← К рабочей панели</button><div class="heading"><div><div class="eyebrow">Энергоблок №1 · материалы предприятия</div><h1>${location?'Где находится насос':'Что контролируется у насоса'}</h1><p class="sub">ПН-01 связан с обозначением ПЭН-1А для учебного сценария.</p></div></div><section class="scheme-card"><div class="source-claim"><strong>Исходный экран предоставлен Елизаветой как материал предприятия.</strong><br>Архивная схема (исходный экран от 01.03.2022). Служебные полосы убраны из изображения. Это сохранённая мнемосхема, а не подключение к АСУ ТП. Текущую неисправность она не подтверждает.</div><div class="scheme-actions">${btn('Расположение в ПДУ','schemeTab',location,'data-value="location" aria-pressed="'+location+'"')}${btn('Параметры ПЭН-А,Б','schemeTab',!location,'data-value="parameters" aria-pressed="'+!location+'"')}${btn(S.schemeZoom?'Уместить схему':'Увеличить схему','schemeZoom')}${btn('Скачать схему без служебных полей','downloadScheme')}</div><div class="scheme-scroll" tabindex="0" aria-label="Мнемосхема с горизонтальной прокруткой"><div class="scheme-image ${S.schemeZoom?'zoom':''}"><img width="1916" height="${location?926:924}" src="${SCHEME_IMAGES[location?'location':'parameters']}" alt="${location?'Питательно-деаэрационная установка с насосами ПЭН-1А, ПЭН-1Б и ПЭН-1В':'Контроль параметров ПЭН-А,Б: двигатель, насос, подшипники, маслосистема и вибрация'}">${location?'<button class="scheme-spot" style="left:40%;top:59.3%;width:11%;height:20.9%" data-action="schemeTab" data-value="parameters" aria-label="ПЭН-1А: открыть параметры"><span>ПЭН-1А · открыть узлы</span></button>':'<button class="scheme-spot" style="left:29%;top:24.7%;width:15%;height:19.8%" data-action="schemePart" data-part="pump" aria-label="ПЭН-1А: проточная часть в 3D"><span>ПЭН-1А · к 3D</span></button><button class="scheme-spot" style="left:23.5%;top:27%;width:6%;height:16.3%" data-action="schemePart" data-part="bearing" aria-label="Опора 3: пояснение в 3D"><span>Опора 3</span></button>'}</div></div><p class="scheme-legend">${location?'ПЭН-1А показан в нижней центральной части схемы, справа от деаэратора. Видны ветвь подачи к ПВД, линия рециркуляции и соседние ПЭН-1Б / ПЭН-1В. Нажмите на выделенный насос, чтобы открыть его параметры.':'Верхняя половина экрана относится к ПЭН-1А, нижняя — к ПЭН-1Б. На насосе обозначены опоры 3 и 4; справа — вибрация по трём направлениям. Выделение добавлено в макете и не является сигналом исходной АСУ ТП.'}</p><div class="scheme-actions">${[['motor','Электропривод в 3D'],['bearing','Подшипниковый узел в 3D'],['pump','Проточная часть в 3D']].map(([v,t])=>btn(t,'schemePart',false,`data-part="${v}"`)).join('')}</div><div class="callout"><h3>Что здесь реальное, а что учебное</h3><p>Обозначения и состав измерений видны в исходных файлах. ПН-01, его текущие показатели, тренды, предупреждение и 3D-геометрия созданы для макета. Связь с ПЭН-1А показывает место оборудования в процессе; это не точная модель его конструкции. Теги, типы датчиков и уставки ещё нужно сверить с документацией станции.</p></div></section>`;}

const partInfo={bearing:['Подшипниковый узел','Два сигнала требуют внимания','Совместный рост вибрации и температуры. Первая версия для проверки — смазка или охлаждение опоры; прямых измерений этих систем пока нет.','Обход и повторные измерения в текущую смену; затем смазка, охлаждение и диагностическое заключение.','4,4','мм/с · вибрация','74','°C · корпус опоры'],motor:['Электропривод','Режим вращения сопоставим','Учебная частота вращения стабильна. Это помогает сопоставлять тренды, но не подтверждает исправность двигателя.','При изменении режима выбрать соответствующий период сравнения.','2 980','об/мин · скорость','—','ток двигателя не подключён'],coupling:['Муфта','Отдельного диагноза нет','Один тренд RMS не позволяет отличить несоосность от других причин. Нужны дополнительные измерения специалиста.','Включить проверку возможных причин в диагностическое задание.','—','осевая вибрация отсутствует','—','спектр не предоставлен'],pump:['Проточная часть','Гидравлический режим в контексте','Подача и давления в учебном окне близки к исходным. Их смотрят вместе с характеристикой конкретного насоса.','При изменении подачи или давлений проверить рабочую точку и достоверность приборов.','780','м³/ч · подача','18,0','МПа · нагнетание']};
function partPanel(){const t=[...partInfo[S.part]];if(S.part==='bearing'&&Object.values(S.checks).some(v=>v!=='pending')){const h=workingHypothesis();t[1]=h.title;t[2]=h.text;if(supportBlocked())t[3]='Проверить канал или режим. После уточнения повторить разбор.';}return `<div class="model-section"><i></i><span class="eyebrow" style="margin:0">${t[0]}</span></div><span class="part-status ${S.part==='bearing'?'':'unknown'}">${S.part==='bearing'?'Отклонение · дефект не подтверждён':S.part==='coupling'?'Данных для оценки узла нет':'Режим сопоставим · исправность не доказана'}</span><h2>${t[1]}</h2><p class="insight">${t[2]}</p><div class="evidence-pair"><div><b>${t[4]}</b><span>${t[5]}</span></div><div><b>${t[6]}</b><span>${t[7]}</span></div></div><div class="next-step"><b>Следующий шаг</b>${t[3]}</div>${btn('Разобрать ПН-01 '+icon('arrow'),'open',true,'data-id="ПН-01"')}<p class="kpi-note">Причина не подтверждена. Решение принимает инженер.</p>`;}
function selectPart(part){S.part=part;const panel=document.getElementById('part-panel');if(panel){panel.innerHTML=partPanel();panel.dataset.part=part;}document.querySelectorAll('[data-action="part"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.part===part)));const label=document.querySelector('.model-annotation');if(label)label.textContent=partInfo[part][0];}
function overview(){return `<div class="heading"><div><div class="eyebrow">Тензор · рабочее место инженера</div><div class="overview-title"><h1>Здоровье оборудования</h1><span class="fleet-count">4 насоса</span></div><p class="sub">Питательные насосы ТЭС. Сигналы, контекст и следующий шаг.</p></div><span class="quality-pill">Учебный срез · 25 октября, 10:00</span></div><div class="fleet-strip">${assets.map((a,i)=>`<button class="fleet-item ${i===0?'active':''}" data-action="open" data-id="${a.id}" aria-label="Открыть ${a.id}"><span class="fleet-icon">${icon('pulse')}</span><span><strong>${a.id}</strong><small>${a.block}</small></span><span>${statusText(a)}</span></button>`).join('')}</div>${operatingSummary()}${operatingMetrics()}<div class="hero-grid" id="model-section"><section class="model-card" aria-label="Интерактивная схема насоса"><div class="model-top"><div><div class="eyebrow">Интерактивная 3D-схема</div><h2>Питательный насос ПН-01</h2><p>ПН-01 ↔ ПЭН-1А на исходной схеме · геометрия условная</p></div><span class="model-id">DEMO / 01</span></div><div class="model-viewport" id="pump-model"></div><div class="model-state" id="model-state" aria-live="polite" hidden></div><span class="model-annotation">${partInfo[S.part][0]}</span><div class="model-hint">Поверните модель мышью или стрелками.<br>Выберите узел на модели или ниже.</div><div class="model-tools"><button data-action="modelSection" aria-pressed="false">Показать внутренние узлы</button><button data-action="modelReset">Сбросить вид</button></div><div class="model-bottom">${[['motor','Электропривод'],['coupling','Муфта'],['bearing','Подшипниковый узел'],['pump','Проточная часть']].map(([v,t])=>`<button class="part-button" data-action="part" data-part="${v}" aria-pressed="${S.part===v}">${t}</button>`).join('')}</div></section><aside class="signal-card" id="part-panel" data-part="${S.part}" aria-live="polite">${partPanel()}</aside></div><p class="signal-note">Иллюстративная геометрия. Выбор узла связывает схему с пояснением, а не моделирует физику насоса.</p><div class="bottom-grid"><section class="chart-card"><div class="card-head"><div><h2>Как развивался сигнал</h2><p class="sub">ПН-01 · виброскорость RMS · 19–25 октября</p></div>${badge(assets[0])}</div>${chart(assets[0],true)}<div class="legend"><span><i></i>Учебные показания</span><span><i class="base"></i>Условный диапазон сравнения, не норматив</span></div></section><section class="chart-card"><div class="card-head"><h2>События</h2>${btn('Журнал','nav',false,'data-to="journal"')}</div>${timeline()}</section></div><div class="section-title"><h2>Оборудование станции</h2><div class="row"><div class="filter" aria-label="Фильтр оборудования">${[['all','Все'],['warn','Требуют разбора'],['no','Нет данных']].map(([v,t])=>`<button data-action="filter" data-value="${v}" aria-pressed="${S.filter===v}">${t}</button>`).join('')}</div><label><span class="sr-only">Поиск оборудования</span><input class="search" id="search" type="search" placeholder="Найти насос…" value="${esc(S.query)}"></label></div></div><div id="asset-table">${assetTable()}</div>`;}
function metricDetail(){const k=S.metricDetail,m=metrics[k];if(!m)return `<button class="back" data-action="nav" data-to="overview">← К обзору</button><section class="metric-detail"><div class="eyebrow">ПН-01 · доверие к данным</div><h1>Что значит «данные доступны»</h1><div class="detail-box"><h2>Доступны показания для разбора</h2><p class="sub">В сценарии есть пакет за 10:00 UTC+3, единицы и временная последовательность. Мы не выдаём процент достоверности, который не рассчитан.</p></div><p class="sub">Перед реальным выводом нужно проверить источник, калибровку, пропуски, зависание, выбросы и сопоставимость режима. Наличие значений не доказывает исправность датчика.</p><div class="callout"><h3>Если показания пропали</h3><p>Оценку приостанавливаем, проверяем канал и повторяем расчёт только после подтверждения данных. Этот вариант реализован на ПН-03.</p></div>${btn('Открыть ПН-03','open',true,'data-id="ПН-03"')}</section>`;return `<button class="back" data-action="nav" data-to="overview">← К показателям</button><section class="metric-detail"><div class="row between"><span class="eyebrow">${m.tag} · условный тег</span><span class="quality-pill">25.10.2026 · 10:00 UTC+3</span></div><h1>${m.label}</h1><div class="number">${m.value} <span>${m.unit}</span></div><span class="metric-status ${metricAssessment[k].tone}">${metricAssessment[k].status}</span><p style="margin-top:16px">${m.meaning}</p><div class="detail-box"><h2>Как читать это значение</h2><p class="sub">${m.context}</p></div><h2>Что делать на основе данных</h2><p class="sub">${m.next}</p><div class="callout"><h3>Граница вывода</h3><p>${m.limit}</p></div><div class="row">${btn('К разбору ПН-01','open',true,'data-id="ПН-01"')}${btn('Все показатели','nav',false,'data-to="overview"')}</div><p class="kpi-note">Состав измерений предложен для проверки со станцией. Наличие этих датчиков у реального заказчика не подтверждено.</p></section>`;}
function assetTable(){const rows=assets.filter(a=>(S.filter==='all'||status(a)===S.filter)&&`${a.id} ${a.block}`.toLowerCase().includes(S.query.toLowerCase()));return rows.length?`<div class="table-wrap"><table><thead><tr><th>Оборудование</th><th>Состояние</th><th>Режим</th><th>Вибрация, мм/с</th><th>Последние данные</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td><button class="asset-link" data-action="open" data-id="${a.id}">${a.id} · Питательный насос</button><div class="muted">${a.block}</div></td><td>${badge(a)}</td><td>${a.mode}</td><td class="mono">${a.id==='ПН-03'&&S.dataFresh?'2,3':a.v}</td><td class="mono">${a.id==='ПН-03'&&S.dataFresh?'25.10 · 10:00':a.last}</td><td>${btn('Открыть','open',false,`data-id="${a.id}" aria-label="Открыть ${a.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Насосов по этому запросу нет. Измените фильтр или строку поиска.</div>';}
function schematic(){return `<div class="diagram"><svg viewBox="0 0 670 145" role="img" aria-label="Упрощённая схема насосного агрегата. Подшипниковый узел выделен для разбора показаний."><path d="M80 100h500" stroke="#d5e1e7" stroke-width="5"/><rect x="75" y="40" width="140" height="60" rx="9" fill="#e2ebef" stroke="#9badb8"/><path d="M98 47v47m21-47v47m21-47v47m21-47v47m21-47v47" stroke="#adbec8"/><path d="M215 69h230" stroke="#7f97a3" stroke-width="9"/><rect x="260" y="49" width="27" height="40" rx="4" fill="#d9e6eb" stroke="#91a7b3"/><rect x="329" y="44" width="42" height="53" rx="5" fill="#ffe2af" stroke="#c98931" stroke-width="2"/><rect x="418" y="28" width="167" height="72" rx="11" fill="#e4f0ed" stroke="#87b9ad"/><path d="M445 33v62m25-62v62m25-62v62m25-62v62m25-62v62" stroke="#b2d0c7"/><path d="M584 65h40V25h-25" stroke="#7faf9f" stroke-width="10" fill="none"/><text x="145" y="127" text-anchor="middle">Электродвигатель</text><text x="274" y="127" text-anchor="middle">Муфта</text><text x="350" y="17" text-anchor="middle">Подшипниковый узел</text><text x="501" y="127" text-anchor="middle">Насос</text></svg><p class="small muted">Упрощённая схема узлов. Геометрия и конструкция реального агрегата не моделируются.</p></div>`;}
function assetPage(){const a=asset(),st=status(a);return `<button class="back" data-action="nav" data-to="overview">← К оборудованию</button><div class="heading"><div><div class="eyebrow">${a.block} · ${a.mode}</div><h1>${a.id} · Питательный насос</h1><p class="sub">Многоступенчатый центробежный насос · подача питательной воды в котёл</p></div>${badge(a)}</div><div class="tabs" aria-label="Разделы карточки">${[['readings','Показания'],['analysis','Разбор сигнала'],['history','История обслуживания']].map(([v,t])=>`<button class="tab" data-action="tab" data-value="${v}" aria-pressed="${S.tab===v}">${t}</button>`).join('')}</div>${S.tab==='history'?history(a):st==='no'?noData(a):st==='neutral'?`<section class="card"><h2>Насос находится в резерве</h2><p class="sub">Сравнение с рабочим режимом отключено. Отсутствие прогноза не означает неисправность или подтверждённую исправность.</p>${schematic()}${btn('К оборудованию','nav',false,'data-to="overview"')}</section>`:S.tab==='analysis'?analysis(a):readings(a)}`;}
function readings(a){const warn=status(a)==='warn';return `<div class="grid"><section class="card"><div class="card-head"><div><h2>Динамика состояния</h2><p class="sub">Датчики подшипникового узла · UTC+3</p></div><div class="filter" aria-label="Период графика">${[['7d','7 дней'],['24h','24 часа']].map(([v,t])=>`<button data-action="period" data-value="${v}" aria-pressed="${S.period===v}">${t}</button>`).join('')}</div></div><div class="metric-inline"><div><strong>${warn?'4,4':a.id==='ПН-03'?'2,3':'2,2'} <span>мм/с</span></strong><span>Виброскорость RMS</span></div><div><strong>${warn?'74':'62'} <span>°C</span></strong><span>Температура</span></div><div><strong>${warn?'780':'775'} <span>м³/ч</span></strong><span>Подача</span></div></div><div class="filter" aria-label="Параметр графика">${[['vibration','Вибрация'],['temperature','Температура']].map(([v,t])=>`<button data-action="metric" data-value="${v}" aria-pressed="${S.metric===v}">${t}</button>`).join('')}</div>${chart(a)}<div class="legend"><span><i></i>Учебные показания</span><span><i class="base"></i>Базовый диапазон сценария</span></div><p class="small muted">Диапазон сравнения условный, это не эксплуатационный норматив. Пределы реального агрегата задают по его документации и режиму.</p>${schematic()}</section><aside class="card"><div class="eyebrow">${warn?'Предупреждение W-001':'Оценка учебного среза'}</div><h2>${warn?'Совместный рост показаний':'Заметного отклонения нет'}</h2><p class="sub">${warn?'Возможное ухудшение состояния подшипникового узла. Первая версия для проверки: смазка или охлаждение опоры.':'В заданном примере показания близки к диапазону сравнения. Это не гарантия исправности.'}</p><div class="fact-list"><div class="fact"><strong>25.10 · 10:00</strong><span>Последний учебный пакет</span></div><div class="fact"><strong>Данные доступны</strong><span>Время и единицы указаны</span></div></div>${warn?`<div class="callout"><h3>Горизонт и следующий шаг</h3>${forecastResult()}</div>${btn('Разобрать предупреждение','tab',true,'data-value="analysis"')}<p class="kpi-note">Проверка в текущую смену; расчёт тренда не разрешает откладывать действия.</p>`:`<div class="notice">${a.id==='ПН-03'?'После повторной проверки появились свежие данные. Задание на канал сохраняется в журнале.':'Новых предупреждений в макете нет.'}</div>${btn('История обслуживания','tab',false,'data-value="history"')}`}</aside></div>`;}
function analysis(a){if(status(a)!=='warn')return `<section class="card"><h2>Активного предупреждения нет</h2><p class="sub">В учебном срезе нет основания для задания по неисправности. Состояние и качество показаний доступны в карточке.</p><div class="row" style="margin-top:20px">${btn('Показания','tab',true,'data-value="readings"')}</div></section>`;return warningAnalysis();}

function noData(a){return `<div class="grid"><section class="card"><div class="alert info">${icon('info')}<div><strong>Оценка состояния приостановлена</strong><p>Последний пакет ПН-03: 25.10 в 03:00. Время среза: 10:00. Новых показаний нет 7 часов.</p></div></div><h2>Сначала нужно восстановить наблюдение</h2><p class="sub">Старое значение не показывает текущее состояние. Макет не трактует отсутствие данных как аварию и не предлагает ремонт насоса.</p><div class="fact-list"><div class="fact"><strong>Вибрация: недоступна</strong><span>Нет свежего пакета</span></div><div class="fact"><strong>Прогноз: недоступен</strong><span>Недостаточно актуальных данных</span></div></div><div class="row" style="margin-top:24px">${btn('Уточнить состояние канала','data',true)}${btn('Задание на проверку данных','dataTask')}</div></section><aside class="card"><h2>Варианты продолжения</h2><ul class="list"><li>Если причина неизвестна, подготовить задание ответственному.</li><li>Если пришёл проверенный пакет, сохранить подтверждение и повторить проверку.</li></ul><p class="small muted">Получение пакета в макете имитируется отдельным учебным действием. Без него оценка остаётся недоступной.</p></aside></div>`;}
function history(a){return `<section class="card"><h2>История ${a.id}</h2><p class="sub">Вымышленные записи для разбора сценария</p><div style="margin-top:24px"><ul class="timeline"><li><time>25 октября · 10:00</time><strong>${a.title}</strong><p>Текущий срез макета.</p></li><li><time>18 сентября</time><strong>Плановый осмотр</strong><p>В учебной записи нет подтверждённого дефекта.</p></li><li><time>12 августа</time><strong>Запись о плановом обслуживании</strong><p>Состав работ и измерения требуют уточнения перед реальной диагностикой.</p></li></ul></div>${S.tasks.filter(t=>t.asset===a.id).map(t=>`<div class="notice">${esc(t.id)} · ${esc(t.title)} ${btn('Открыть задание','task',false,`data-id="${t.id}"`)}</div>`).join('')}</section>`;}
const actionNames={diagnostics:'Дополнительная диагностика',maintenance:'Согласование планового обслуживания',observe:'Повторная оценка состояния',data:'Проверка канала данных'};
function draft(){const key=S.asset+':'+S.choice;if(!S.drafts[key])S.drafts[key]={owner:'',due:'',reason:S.choice==='data'?'Нет свежих показаний ПН-03 с 03:00. Проверить причину разрыва и предоставить подтверждённый пакет данных.':(supportBlocked()?'W-001: проверить канал и сопоставимость режима. После уточнения повторить оценку.':S.choice==='diagnostics'?'W-001: организовать обход и повторные измерения опоры в текущую смену; сверить режим, смазку и охлаждение. При подтверждении роста получить диагностическое заключение и рекомендации. Срок и допуск согласовать по правилам станции.':S.choice==='maintenance'?'W-001: на основании диагностического заключения согласовать план работ, резерв, окно и ресурсы. Без заключения предложение требует уточнения.':'W-001: согласовать с инженером срок и критерии повторной оценки. Зафиксировать режим, повторные измерения и условия более раннего реагирования.')};return S.drafts[key];}
function decision(){const d=draft();return `<button class="back" data-action="backAsset">← К разбору сигнала</button><div class="heading"><div><div class="eyebrow">Решение инженера · ${S.asset}</div><h1>${S.choice==='data'?'Проверка данных':'Подготовка задания'}</h1><p class="sub">Задание создаётся в макете и доступно для скачивания. В систему ремонтов оно не отправляется.</p></div></div><div class="steps"><span>1. Оборудование</span><span>›</span><span>2. Разбор</span><span>›</span><span class="current">3. Решение и задание</span><span>›</span><span>4. Результат</span></div><div class="grid"><section class="card"><h2>${S.choice==='data'?'Запрос ответственному за данные':'Какое действие выбираете?'}</h2>${S.choice==='data'?'<p class="sub">Сначала проверяем канал. Задание на ремонт оборудования на основании пропуска данных недоступно.</p>':`<div class="action-grid">${[['diagnostics','Дополнительная диагностика','Собрать сведения для проверки причины отклонения.'],['maintenance','Согласование планового обслуживания','Подготовить предложение с обоснованием. Срок и допуск согласуют вне макета.'],['observe','Повторная оценка состояния','Указать обоснование, ответственного и дату следующего разбора.']].map(([v,t,s])=>`<label class="choice"><input type="radio" name="actionChoice" value="${v}" ${S.choice===v?'checked':''}><span><strong>${t}</strong><small>${s}</small></span></label>`).join('')}</div>`}<form id="task-form" novalidate><div id="form-error" class="error" role="alert"></div><label class="field">Обоснование и ожидаемый результат *<textarea id="reason" name="reason" required maxlength="1200">${esc(d.reason)}</textarea></label><div class="form-grid"><label class="field">Ответственный *<input name="owner" id="owner" value="${esc(d.owner)}" placeholder="Имя или роль в учебном сценарии" required maxlength="100" autocomplete="off"></label><label class="field">Срок *<input name="due" id="due" type="date" value="${esc(d.due)}" min="2026-10-25" max="2027-10-25" required><small>Относительно даты учебного среза 25.10.2026</small></label></div><div class="row"><button type="submit" class="btn primary">Создать учебное задание</button>${btn('Назад к карточке','backAsset')}</div></form></section><aside class="card"><div class="eyebrow">Контекст задания</div><h2>${S.asset}</h2><p class="sub">Питательный насос · ${asset().block}</p><div class="detail-row"><span class="muted">Основание</span><strong>${S.choice==='data'?'Пропуск данных':'Предупреждение W-001'}</strong></div><div class="detail-row"><span class="muted">Действие</span><strong>${actionNames[S.choice]}</strong></div>${S.choice==='data'?'':`<details class="support-details"><summary>Данные проверок, которые попадут в задание</summary><p class="context-copy">${esc(supportTaskContext())}</p></details>`}<div class="callout"><h3>Контроль остаётся у человека</h3><p>Создание записи не подтверждает неисправность и не разрешает работы. Реальные решения согласуют по правилам станции.</p></div><p class="small muted">Черновик сохраняется при возврате в этой вкладке. При перезагрузке записи исчезнут.</p></aside></div>`;}
function dataPage(){return `<button class="back" data-action="backAsset">← К ПН-03</button><div class="heading"><div><div class="eyebrow">ПН-03 · качество данных</div><h1>Уточнение состояния канала</h1></div></div><section class="card" style="max-width:800px"><h2>${S.dataSaved?'Подтверждение сохранено':'Что известно после проверки?'}</h2>${S.dataSaved?`<div class="notice">В учебном сценарии получен пакет за 10:00, время и единицы проверены. Прежняя оценка остаётся недоступной до повторной проверки.</div>${btn('Повторить проверку','recheck',true)}<div style="margin-top:12px">${btn('Вернуться к карточке','backAsset')}</div>`:`<p class="sub">Результат реального обращения не имитируется автоматически. Для демонстрации можно выбрать подготовленный ответ.</p><div class="action-grid"><label class="choice"><input type="radio" name="dataChoice" value="unknown" ${S.dataChoice==='unknown'?'checked':''}><span><strong>Причина неизвестна</strong><small>Свежего проверенного пакета пока нет.</small></span></label><label class="choice"><input type="radio" name="dataChoice" value="confirmed" ${S.dataChoice==='confirmed'?'checked':''}><span><strong>Учебный ответ: пакет восстановлен и проверен</strong><small>Пакет за 25.10, 10:00 UTC+3; время и единицы согласованы. Это имитация для сценария.</small></span></label></div><div id="data-error" class="error" role="alert"></div><div class="row">${btn('Сохранить подтверждение','saveData',true)}${btn('Подготовить задание на данные','dataTask')}</div>`}</section>`;}
function tasksPage(){return `<div class="heading"><div><div class="eyebrow">Обслуживание и диагностика</div><h1>Задания инженера</h1><p class="sub">Учебные записи текущей сессии. Реальная отправка и согласование не выполняются.</p></div>${btn('К оборудованию','nav',false,'data-to="overview"')}</div>${S.tasks.length?`<div class="table-wrap"><table><thead><tr><th>Задание</th><th>Оборудование</th><th>Ответственный</th><th>Срок</th><th>Статус</th><th></th></tr></thead><tbody>${S.tasks.map(t=>`<tr><td><strong>${t.id}</strong><div class="muted">${esc(t.title)}</div></td><td>${t.asset}</td><td>${esc(t.owner)}</td><td>${esc(t.due)}</td><td><span class="badge ${t.result?'good':'neutral'}">${t.result?'Результат записан':'Подготовлено'}</span></td><td>${btn('Открыть','task',false,`data-id="${t.id}" aria-label="Открыть ${t.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h2>Заданий пока нет</h2><p class="sub">Откройте ПН-01, разберите предупреждение и выберите действие инженера.</p><div style="margin-top:20px">'+btn('Разобрать ПН-01','open',true,'data-id="ПН-01"')+'</div></div>'}`;}
function taskPage(){const t=S.tasks.find(t=>t.id===S.taskId);return `<button class="back" data-action="nav" data-to="tasks">← Все задания</button><div class="heading"><div><div class="eyebrow">${t.id} · ${t.asset}</div><h1>${esc(t.title)}</h1><p class="sub">Задание создано в макете. Реальная заявка не отправлена.</p></div>${btn(icon('download')+'Скачать задание','download',true)}</div><div class="grid"><section class="card"><span class="badge ${t.result?'good':'neutral'}">${t.result?'Результат записан':'Подготовлено'}</span><dl><div class="detail-row"><dt>Оборудование</dt><dd>${t.asset} · Питательный насос</dd></div><div class="detail-row"><dt>Основание</dt><dd>${t.kind==='data'?'Нет свежих показаний':'W-001 · рост вибрации и температуры'}</dd></div><div class="detail-row"><dt>Обоснование</dt><dd>${esc(t.reason)}</dd></div>${t.context?`<div class="detail-row"><dt>Проверки при создании</dt><dd>${esc(t.context)}</dd></div>`:``}<div class="detail-row"><dt>Ответственный</dt><dd>${esc(t.owner)}</dd></div><div class="detail-row"><dt>Срок</dt><dd>${esc(t.due)}</dd></div>${t.result?`<div class="detail-row"><dt>Результат</dt><dd>${esc(t.result)}</dd></div><div class="detail-row"><dt>Комментарий</dt><dd>${esc(t.feedback)}</dd></div>`:''}</dl><div class="row">${btn('К карточке оборудования','open',false,`data-id="${t.asset}"`)}${btn('Все задания','nav',false,'data-to="tasks"')}</div><p class="kpi-note">Статус оборудования не меняется автоматически после записи результата задания.</p></section><aside class="card"><h2>Результат проверки</h2><p class="sub">Можно записать учебный исход и оставить комментарий для следующего разбора.</p><form id="result-form" novalidate style="margin-top:20px"><div id="result-error" class="error" role="alert"></div><label class="field">Исход *<select id="result" name="result"><option value="">Выберите исход</option>${(t.kind==='data'?['Канал восстановлен','Причина уточняется']:['Нужна дальнейшая диагностика','Нужно согласовать обслуживание','Отклонение не подтвердилось']).map(v=>`<option ${t.result===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Что выяснили и что делать дальше *<textarea id="feedback" name="feedback" required maxlength="1200">${esc(t.feedback||'')}</textarea></label><button class="btn primary" type="submit">Записать результат</button></form></aside></div>`;}
function journal(){return `<div class="heading"><div><div class="eyebrow">События</div><h1>Журнал решений</h1><p class="sub">Действия в текущей сессии и исходные события учебного сценария</p></div></div><div class="grid"><section class="card"><h2>Действия инженера в макете</h2><div style="margin-top:20px">${S.events.length?`<ul class="timeline">${S.events.toReversed().map(e=>`<li><time>Шаг ${e.n} текущей сессии</time><strong>${esc(e.text)}</strong></li>`).join('')}</ul>`:'<p class="sub">Записей пока нет. После создания задания или проверки данных здесь появится событие.</p>'}</div></section><section class="card"><h2 style="margin-bottom:20px">Исходные события</h2>${timeline()}</section></div>`;}
function about(){return `<div class="heading"><div><div class="eyebrow">Тензор · оборудование ТЭС</div><h1>Раннее предупреждение для инженера ТЭС</h1></div></div><section class="card about" style="max-width:950px"><h2>Что проверяем</h2><p class="sub">Понятно ли инженеру, почему насос требует внимания, какие ограничения есть у вывода и как подготовить обоснованное задание на диагностику или обслуживание.</p><h2 style="margin-top:24px">Почему питательный насос</h2><p>Это конкретное оборудование тепловой электростанции. Сценарий связывает показания подшипникового узла с решением инженера. Выбор класса оборудования пока не согласован с реальным заказчиком.</p><h2 style="margin-top:24px">Границы макета</h2><p>Показания панели, события, диапазоны и выводы вымышлены. Мнемосхемы ПДУ и ПЭН-А,Б взяты из предоставленных Елизаветой материалов предприятия от 1 марта 2022 года; их текущая актуальность не подтверждена. Здесь нет работающей модели прогноза, расчёта остаточного ресурса или физического цифрового двойника. Есть объяснимый расчёт продолжения тренда до учебной границы и калькулятор затрат. Они показывают допущения, а не доказанный срок до отказа или полученную экономию. Вероятность события модель не оценивает. Кнопки не отправляют задания и не управляют оборудованием.</p><p>Настоящий продукт потребует согласованных данных, проверки прогноза на будущих периодах и правил работы с предупреждениями.</p><p class="kpi-note">Справочно о классе оборудования: <a href="https://www.ksb.com/en-global/centrifugal-pump-lexicon/article/boiler-feed-pump-1118674" target="_blank" rel="noopener">KSB: Boiler feed pump</a>. Этот источник не подтверждает диагноз или пороги учебного сценария.</p></section>`;}
function log(text){S.events.push({n:S.events.length+1,text});}
function render(){unmountModel();unmountModel=()=>{};nav();main.innerHTML=({overview,metricDetail,scheme:schemePage,asset:assetPage,decision,data:dataPage,tasks:tasksPage,task:taskPage,journal,about}[S.screen]||overview)()+footer();if(S.screen==='overview'){unmountModel=window.mountPumpView?.(document.getElementById('pump-model'),selectPart)||(()=>{});document.getElementById('pump-model')?.pumpControls?.select(S.part);if(S.section){document.getElementById('pump-model')?.pumpControls?.section();}updateModelControls();}}
function download(){const t=S.tasks.find(t=>t.id===S.taskId);const body=`ТЕНЗОР · УЧЕБНОЕ ЗАДАНИЕ\n${t.id}\nОборудование: ${t.asset} · Питательный насос ТЭС\nДействие: ${t.title}\nОснование: ${t.kind==='data'?'Нет свежих данных':'W-001'}\nОбоснование: ${t.reason}\n${t.context?`Контекст при создании:\n${t.context}\n`:``}Ответственный: ${t.owner}\nСрок: ${t.due}\nСтатус: ${t.result?'Результат записан':'Подготовлено'}\nРезультат: ${t.result||'Не внесён'}\nКомментарий: ${t.feedback||'Не внесён'}\n\nВсе сведения учебные. Задание не отправлено. Работы и действия с оборудованием требуют отдельного согласования.\n`;const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`tenzor-${t.id}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Файл задания подготовлен для скачивания.');}

function updateModelControls(){const host=document.getElementById('pump-model'),b=document.querySelector('[data-action=modelSection]'),note=document.getElementById('model-state');if(!b)return;const available=!!host?.pumpControls;b.disabled=!available;b.setAttribute('aria-pressed',String(available&&S.section));b.textContent=!available?'3D-разрез недоступен':S.section?'Скрыть внутренние узлы':'Показать внутренние узлы';if(note){note.hidden=!S.section||!available;note.textContent='Корпуса скрыты: ротор, вал и семь рабочих колёс. Это иллюстрация, не диагноз.';}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'overviewAnalysis':S.asset='ПН-01';S.tab='analysis';go('asset');break;case'downloadScheme':downloadScheme();break;case'scheme':S.scheme='location';S.schemeZoom=false;go('scheme');break;case'schemeTab':S.scheme=b.dataset.value;S.schemeZoom=false;render();break;case'schemeZoom':S.schemeZoom=!S.schemeZoom;render();break;case'schemePart':S.part=b.dataset.part;go('overview');document.getElementById('model-section')?.scrollIntoView({block:'start'});break;case'metricDetail':S.metricDetail=b.dataset.value;go('metricDetail');break;case'part':document.getElementById('pump-model')?.pumpControls?.select(b.dataset.part);selectPart(b.dataset.part);break;case'modelSection':if(document.getElementById('pump-model')?.pumpControls){S.section=document.getElementById('pump-model').pumpControls.section();updateModelControls();}break;case'modelReset':document.getElementById('pump-model')?.pumpControls?.reset();S.section=false;updateModelControls();break;case'nav':go(b.dataset.to);break;case'open':selectAsset(b.dataset.id);break;case'filter':S.filter=b.dataset.value;render();break;case'tab':S.tab=b.dataset.value;render();break;case'period':S.period=b.dataset.value;render();break;case'metric':S.metric=b.dataset.value;render();break;case'decide':if(status(asset())==='warn'){S.choice='diagnostics';go('decision');}break;case'dataTask':S.asset='ПН-03';S.choice='data';go('decision');break;case'backAsset':S.tab=S.choice==='data'?'readings':'analysis';go('asset');break;case'data':go('data');break;case'saveData':if(S.dataChoice!=='confirmed'){const err=document.getElementById('data-error');err.textContent='Нет подтверждённого пакета. Выберите учебный ответ с проверенными данными или подготовьте задание на канал.';document.querySelector('[name=dataChoice]').focus();}else{S.dataSaved=true;log('ПН-03: сохранено учебное подтверждение пакета. Нужна повторная проверка.');render();}break;case'recheck':if(S.dataSaved){S.dataFresh=true;log('ПН-03: повторная проверка завершена, учебные показания доступны.');S.tab='readings';go('asset');notify('Пакет повторно проверен. Оценка учебного среза доступна.');}break;case'task':S.taskId=b.dataset.id;go('task');break;case'download':download();break;}});
document.addEventListener('input',e=>{if(e.target.id==='forecast-limit'){S.limit=e.target.value;document.getElementById('forecast-result').innerHTML=forecastResult();}if(e.target.dataset.economic){S.economics[e.target.dataset.economic]=e.target.value;document.getElementById('economic-result').innerHTML=economicResult();}if(e.target.id==='inspection-note')S.inspectionNote=e.target.value;if(e.target.id==='search'){S.query=e.target.value;document.getElementById('asset-table').innerHTML=assetTable();}if(e.target.closest('#task-form')&&['owner','due','reason'].includes(e.target.name))draft()[e.target.name]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.dataset.check){const key=e.target.dataset.check,y=scrollY;S.checks[key]=e.target.value;log('ПН-01: '+Support.checks.find(c=>c.id===key).title+' — '+Support.checks.find(c=>c.id===key).options.find(([v])=>v===S.checks[key])[1]+'. Учебная запись.');render();window.scrollTo(0,y);document.querySelector('[data-check="'+key+'"]')?.focus({preventScroll:true});}if(e.target.name==='actionChoice'){S.choice=e.target.value;render();}if(e.target.name==='dataChoice')S.dataChoice=e.target.value;});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='task-form'){const d=draft();let field,message;if(!d.reason.trim()){field='reason';message='Укажите обоснование и ожидаемый результат.';}else if(!d.owner.trim()){field='owner';message='Укажите ответственного за задание.';}else if(!d.due||d.due<'2026-10-25'||d.due>'2027-10-25'){field='due';message='Укажите срок от 25.10.2026 до 25.10.2027 для учебного сценария.';}if(field){document.getElementById('form-error').textContent=message;document.getElementById(field).focus();return;}const t={id:'ТО-'+String(S.tasks.length+1).padStart(3,'0'),asset:S.asset,kind:S.choice,title:actionNames[S.choice],owner:d.owner.trim(),reason:d.reason.trim(),due:d.due,context:S.choice==='data'?'':supportTaskContext(),result:'',feedback:''};S.tasks.push(t);S.taskId=t.id;log(`${t.id}: ${t.asset}, ${t.title}. Задание создано в макете.`);go('task');notify('Учебное задание создано. Его можно скачать.');}if(e.target.id==='result-form'){const result=document.getElementById('result').value,feedback=document.getElementById('feedback').value.trim();if(!result||!feedback){document.getElementById('result-error').textContent='Выберите исход и запишите результат проверки.';document.getElementById(!result?'result':'feedback').focus();return;}const t=S.tasks.find(t=>t.id===S.taskId);t.result=result;t.feedback=feedback;log(`${t.id}: записан результат «${result}».`);render();notify('Результат сохранён в этой сессии.');}});
render();
</script></body></html>
